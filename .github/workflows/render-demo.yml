name: Render Episode 002 with Real Game Assets

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/render-demo.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    env:
      RENDER_CONCURRENCY: "1"

    steps:
      - name: Checkout foundation branch
        uses: actions/checkout@v4
        with:
          ref: v0/factory-foundation
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow

      - name: Download official Steam screenshots and Pixabay music
        run: python scripts/fetch-real-assets.py

      - name: Commit real assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/portal-2 assets/images/subnautica assets/images/bioshock assets/images/resident-evil-7 assets/images/control assets/music/neon-pulse.mp3
          if git diff --cached --quiet; then
            echo "Real assets already committed."
          else
            git commit -m "Replace AI clues with official Steam screenshots"
            git push origin HEAD:v0/factory-foundation
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Validate episode 002
        run: npm run validate -- episode-002

      - name: Typecheck
        run: npm run typecheck

      - name: Render screenshots
        run: npm run screenshot -- episode-002

      - name: Render MP4
        run: npm run make -- episode-002 --force

      - name: Upload final render
        uses: actions/upload-artifact@v4
        with:
          name: episode-002-real-assets
          path: |
            output/episode-002.mp4
            output/screenshots/episode-002/*.png
          if-no-files-found: error
          retention-days: 14
