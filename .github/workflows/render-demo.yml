name: Render TikTok Demos

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      RENDER_CONCURRENCY: "1"

    steps:
      - name: Checkout foundation branch
        uses: actions/checkout@v4
        with:
          ref: v0/factory-foundation

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate all episodes
        run: npm run validate

      - name: Typecheck
        run: npm run typecheck

      - name: Render episode 001 screenshots
        run: npm run screenshot -- episode-001

      - name: Render episode 002 screenshots
        run: npm run screenshot -- episode-002

      - name: Render all MP4s
        run: npm run batch -- --force

      - name: Upload renders
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-quiz-renders
          path: |
            output/episode-001.mp4
            output/episode-002.mp4
            output/screenshots/episode-001/*.png
            output/screenshots/episode-002/*.png
          if-no-files-found: error
          retention-days: 14
