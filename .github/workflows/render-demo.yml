name: Render Episode 004 Runet Memes

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/render-demo.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      RENDER_CONCURRENCY: "1"

    steps:
      - name: Checkout foundation branch
        uses: actions/checkout@v4
        with:
          ref: v0/factory-foundation
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install media tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          python -m pip install --disable-pip-version-check pillow yt-dlp
          ffmpeg -version
          ffprobe -version

      - name: Prepare Runet meme frames and audio
        run: python scripts/fetch-episode-004-assets.py

      - name: Commit episode 004 assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/hooks/episode-004-approved.webp assets/images/memes assets/audio/memes assets/music/monkeys-spinning-monkeys.mp3
          if git diff --cached --quiet; then
            echo "Episode 004 media already committed."
          else
            git commit -m "Add Runet meme frames and reveal audio"
            git push origin HEAD:v0/factory-foundation
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Generate quiz SFX
        run: npm run assets:audio

      - name: Validate episode 004
        run: npm run validate -- episode-004

      - name: Typecheck
        run: npm run typecheck

      - name: Render screenshots
        run: npm run screenshot -- episode-004

      - name: Render MP4
        run: npm run make -- episode-004 --force

      - name: Upload final render
        uses: actions/upload-artifact@v4
        with:
          name: episode-004-memes-audio-v2
          path: |
            output/episode-004.mp4
            output/screenshots/episode-004/*.png
          if-no-files-found: error
          retention-days: 14
