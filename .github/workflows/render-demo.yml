name: Render Episode 003 with Stop-Scroll Hook

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/render-demo.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    env:
      RENDER_CONCURRENCY: "1"

    steps:
      - name: Checkout foundation branch
        uses: actions/checkout@v4
        with:
          ref: v0/factory-foundation
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow

      - name: Download episode 003 Steam screenshots and music
        run: python scripts/fetch-episode-003-assets.py

      - name: Commit episode 003 real assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/half-life-2 assets/images/witcher-3 assets/images/little-nightmares assets/images/death-stranding assets/images/stalker-2 assets/music/digital-lemonade.mp3
          if git diff --cached --quiet; then
            echo "Episode 003 assets already committed."
          else
            git commit -m "Add real Steam screenshots for episode 003"
            git push origin HEAD:v0/factory-foundation
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Generate redesigned quiz SFX
        run: npm run assets:audio

      - name: Validate episode 003
        run: npm run validate -- episode-003

      - name: Typecheck
        run: npm run typecheck

      - name: Render screenshots
        run: npm run screenshot -- episode-003

      - name: Render MP4
        run: npm run make -- episode-003 --force

      - name: Upload final render
        uses: actions/upload-artifact@v4
        with:
          name: episode-003-stop-scroll
          path: |
            output/episode-003.mp4
            output/screenshots/episode-003/*.png
          if-no-files-found: error
          retention-days: 14
